name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smalljoy
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: small_joy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smalljoy" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://smalljoy:ci-password@localhost:5432/small_joy
      TEST_DATABASE_URL: postgresql://smalljoy:ci-password@localhost:5432/small_joy_test
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-123
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      PAYMENT_PROVIDER: mock
      MOCK_PAYMENT_WEBHOOK_SECRET: ci-only-mock-webhook-secret
      STORAGE_DRIVER: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create test database
        run: PGPASSWORD=ci-password psql -h localhost -U smalljoy -d small_joy -c "CREATE DATABASE small_joy_test"
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Seed demo data and E2E admin
        run: |
          npm run db:seed
          ADMIN_EMAIL=admin@example.com ADMIN_NAME=CI ADMIN_PASSWORD=dev-admin-password-123 npm run admin:create
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
